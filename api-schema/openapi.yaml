openapi: 3.0.3
info:
  title: Jacko API
  version: 0.1.0
  description: >-
    HTTP contract for the implemented account, session, community, messaging and attachment operations.
    REST requests have a 10-second dependency deadline; an expired operation can return
    504 with code request_timeout. Private responses use Cache-Control no-store.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: registerAccount
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/UserID'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/Tokens'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token:
                  $ref: '#/components/schemas/Token'
      responses:
        '200':
          $ref: '#/components/responses/Tokens'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/session:
    get:
      operationId: getCurrentSession
      responses:
        '200':
          $ref: '#/components/responses/UserID'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: revokeCurrentSession
      responses:
        '204':
          description: Session revoked.
        default:
          $ref: '#/components/responses/Error'
  /channels/{channel}/messages:
    parameters:
      - name: channel
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
    get:
      operationId: listMessages
      parameters:
        - name: before
          in: query
          description: Exclusive message ID from the previous page's next_before.
          schema:
            $ref: '#/components/schemas/ID'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Page sorted by descending message ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nonce]
              properties:
                nonce:
                  type: string
                  description: Idempotency key scoped to the author. At most 64 UTF-8 bytes.
                  minLength: 1
                  maxLength: 64
                content:
                  type: string
                  description: Message text. Required for text-only messages. At most 8192 UTF-8 bytes.
                  maxLength: 8192
                attachment_id:
                  $ref: '#/components/schemas/AttachmentID'
                reply_to:
                  $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Persisted message. A retry with the original nonce and payload returns the current version of the same message. A deleted message returns 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        default:
          $ref: '#/components/responses/Error'
  /channels/{channel}/messages/{message}:
    parameters:
      - name: channel
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: message
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
    patch:
      operationId: editMessage
      description: Only the author can edit a live message while a member of its channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content:
                  type: string
                  description: Updated text. An empty caption is allowed on an image message. At most 8192 UTF-8 bytes.
                  maxLength: 8192
      responses:
        '200':
          description: Current message with its edit timestamp when edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMessage
      description: Only the author can delete a message while a member of its channel. Repeated deletion is idempotent.
      responses:
        '204':
          description: Message removed from history.
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /guilds:
    get:
      operationId: listGuilds
      parameters:
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Communities the caller belongs to, in ascending ID order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createGuild
      requestBody:
        $ref: '#/components/requestBodies/Name'
      responses:
        '201':
          description: The community and its default general channel.
          content:
            application/json:
              schema:
                type: object
                required: [guild, channel]
                properties:
                  guild:
                    $ref: '#/components/schemas/Guild'
                  channel:
                    $ref: '#/components/schemas/Channel'
        default:
          $ref: '#/components/responses/Error'
  /guilds/{guild}/channels:
    parameters:
      - $ref: '#/components/parameters/Guild'
    get:
      operationId: listChannels
      parameters:
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Text channels visible to a community member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChannel
      description: Requires community ownership.
      requestBody:
        $ref: '#/components/requestBodies/Name'
      responses:
        '201':
          description: Created text channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          $ref: '#/components/responses/Error'
  /guilds/{guild}/members:
    parameters:
      - $ref: '#/components/parameters/Guild'
    get:
      operationId: listGuildMembers
      description: Requires community membership. Online status reflects active WebSocket connections and is omitted when presence is unavailable.
      parameters:
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Member page in ascending user ID order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /guilds/{guild}/invites:
    parameters:
      - $ref: '#/components/parameters/Guild'
    post:
      operationId: createInvite
      description: Requires community ownership. The invitation is reusable for seven days.
      responses:
        '201':
          description: Invitation and expiration time.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    $ref: '#/components/schemas/Token'
                  expires_at:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/Error'
  /invites/redeem:
    post:
      operationId: redeemInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  $ref: '#/components/schemas/Token'
      responses:
        '200':
          description: Joined community. Repeated redemption by a member returns the same community.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /channels/{channel}/attachments:
    parameters:
      - name: channel
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
    post:
      operationId: beginImageUpload
      description: Request a short-lived S3 form for a JPEG or PNG image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [media_type, size_bytes]
              properties:
                media_type:
                  type: string
                  enum: [image/jpeg, image/png]
                size_bytes:
                  type: integer
                  minimum: 1
                  maximum: 8388608
      responses:
        '201':
          description: Submit all fields and the image as the last file field in a multipart POST to url.
          content:
            application/json:
              schema:
                type: object
                required: [id, url, fields, expires_at]
                properties:
                  id:
                    $ref: '#/components/schemas/AttachmentID'
                  url:
                    type: string
                    format: uri
                  fields:
                    type: object
                    additionalProperties:
                      type: string
                  expires_at:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/Error'
  /attachments/{attachment}/complete:
    parameters:
      - $ref: '#/components/parameters/Attachment'
    post:
      operationId: completeImageUpload
      description: Verify and seal an uploaded image. Only its uploader can complete it.
      responses:
        '200':
          description: Verified image metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAttachment'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /attachments/{attachment}:
    parameters:
      - $ref: '#/components/parameters/Attachment'
    get:
      operationId: getImageAttachment
      description: Return a 60-second download URL for an attachment on a visible message.
      responses:
        '200':
          description: Verified image metadata and signed download URL.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ImageAttachment'
                  - type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: uri
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Attachment:
      name: attachment
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AttachmentID'
    Guild:
      name: guild
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    After:
      name: after
      in: query
      description: Exclusive ID from the previous page's next_after. Pages contain up to 100 items.
      schema:
        $ref: '#/components/schemas/ID'
  requestBodies:
    Name:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 80
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
              email:
                type: string
                format: email
                maxLength: 254
              password:
                type: string
                format: password
                minLength: 1
                maxLength: 256
                description: Registration requires at least 12 characters. All operations cap passwords at 256 UTF-8 bytes.
  responses:
    RateLimited:
      description: >-
        Too many authentication attempts from the connection peer on this process.
        Login and registration share a burst of 10, refilling one request every 6 seconds.
        Refresh has a separate burst of 60, refilling one request per second.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code:
                type: string
                enum: [rate_limited]
    UserID:
      description: User identifier.
      content:
        application/json:
          schema:
            type: object
            required: [user_id]
            properties:
              user_id:
                $ref: '#/components/schemas/ID'
    Tokens:
      description: Access and refresh tokens for the current session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenPair'
    Error:
      description: API error with a machine-readable code.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code:
                type: string
  schemas:
    AttachmentID:
      type: string
      pattern: '^[0-9a-f]{32}$'
    ImageAttachment:
      type: object
      required: [id, media_type, size_bytes, width, height]
      properties:
        id:
          $ref: '#/components/schemas/AttachmentID'
        media_type:
          type: string
          enum: [image/jpeg, image/png]
        size_bytes:
          type: integer
        width:
          type: integer
        height:
          type: integer
    Guild:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        owner_id:
          $ref: '#/components/schemas/ID'
    Channel:
      type: object
      required: [id, guild_id, name]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        guild_id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
    MemberPage:
      type: object
      required: [items, presence_available]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GuildMember'
        next_after:
          $ref: '#/components/schemas/ID'
        presence_available:
          type: boolean
    GuildMember:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        role:
          type: string
          enum: [owner, member]
        online:
          type: boolean
    GuildPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Guild'
        next_after:
          $ref: '#/components/schemas/ID'
    ChannelPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        next_after:
          $ref: '#/components/schemas/ID'
    ID:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Positive signed 64-bit identifier represented as a decimal string.
    Token:
      type: string
      pattern: '^[0-9a-fA-F]{64}$'
    TokenPair:
      type: object
      required: [user_id, access_token, refresh_token, expires_at, refresh_expires_at]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        access_token:
          $ref: '#/components/schemas/Token'
        refresh_token:
          $ref: '#/components/schemas/Token'
        expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, channel_id, author_id, content, created_at]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        channel_id:
          $ref: '#/components/schemas/ID'
        author_id:
          $ref: '#/components/schemas/ID'
        content:
          type: string
        created_at:
          type: string
          format: date-time
        attachment_id:
          $ref: '#/components/schemas/AttachmentID'
        reply_to:
          $ref: '#/components/schemas/ID'
        edited_at:
          type: string
          format: date-time
    HistoryPage:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_before:
          $ref: '#/components/schemas/ID'
