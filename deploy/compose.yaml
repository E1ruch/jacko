services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jacko
      POSTGRES_PASSWORD: jacko
      POSTGRES_DB: jacko
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jacko", "-d", "jacko"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  s3:
    image: chrislusf/seaweedfs:4.53
    environment:
      AWS_ACCESS_KEY_ID: jacko-local
      AWS_SECRET_ACCESS_KEY: jacko-local-storage
      S3_BUCKET: jacko
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - s3-data:/data

  mailpit:
    image: axllent/mailpit:v1.26.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  s3-data:
  postgres-data:
